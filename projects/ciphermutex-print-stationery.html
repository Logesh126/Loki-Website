<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CipherMutex Print &amp; Stationery — CipherMutex</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090812;color:#f6f3fb;font-family:Manrope,Arial,sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1440px;margin:auto;padding:36px 5vw 100px}
nav{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #292534;padding:8px 0 22px}
.brand{font-weight:800;letter-spacing:-.04em}.brand span{color:#b59aff}.eyebrow{font:11px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#b59aff}
h1{font-size:clamp(48px,9vw,110px);letter-spacing:-.085em;line-height:.94;margin:24px 0 16px}
.intro{color:#aaa2b5;max-width:620px;line-height:1.7}.back{color:#c4b6e9;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:55px}
.card{border:1px solid #302a3b;background:#15121d;padding:25px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;transition:.25s}
.card:hover{transform:translateY(-5px);border-color:#b59aff;background:#1b1725}.count{font:11px 'DM Mono';color:#a89db8}.card h2{font-size:27px;letter-spacing:-.06em;margin:14px 0}.arrow{color:#b59aff;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:34px}
figure{margin:0;background:#15121d;border:1px solid #292433;overflow:hidden}
figure img{width:100%;height:320px;object-fit:contain;background:#f4f4f4;display:block;cursor:zoom-in}
figcaption{padding:12px 14px;color:#d8d1e1;font-size:12px;min-height:42px}
.lightbox{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;padding:4vw;z-index:9}
.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain}.lightbox button{position:absolute;top:20px;right:25px;background:#fff;color:#000;border:0;padding:12px 18px;cursor:pointer}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid,.cards{grid-template-columns:1fr}.wrap{padding:25px 5vw 70px}figure img{height:auto;max-height:520px}}
</style></head><body><main class="wrap"><nav><a class="brand" href="../index.html">LOGESH<span>®</span></a><a class="back" href="ciphermutex.html">← CipherMutex project</a></nav><div class="eyebrow">CipherMutex / Design archive</div><h1>Print &amp; Stationery<span style="color:#b59aff">.</span></h1><p class="intro">5 design files in this collection.</p><section class="grid"><figure><img loading="lazy" decoding="async" src="../gallery-assets/Ciphermutex_1/002_Visiting_Card_4/page-001.jpg" alt="Visiting Card 4"><figcaption>Visiting Card 4</figcaption></figure><figure><img loading="lazy" decoding="async" src="../gallery-assets/Ciphermutex_1/001_Visiting_Card_7/page-001.jpg" alt="Visiting Card 7"><figcaption>Visiting Card 7</figcaption></figure><figure><img loading="lazy" decoding="async" src="../gallery-assets/CipherMutex_new_uploads/259_Visiting_Card_8.webp" alt="Visiting Card 8"><figcaption>Visiting Card 8</figcaption></figure><figure><img loading="lazy" decoding="async" src="../gallery-assets/CipherMutex_new_uploads/260_Visiting_Card_9.webp" alt="Visiting Card 9"><figcaption>Visiting Card 9</figcaption></figure><figure><img loading="lazy" decoding="async" src="../gallery-assets/CipherMutex_new_uploads/letterhead.webp" alt="Letterhead"><figcaption>Letterhead</figcaption></figure></section></main><div class="lightbox" id="lightbox"><button id="closeLightbox">Close ✕</button><img alt="Expanded design"></div><script>document.querySelectorAll("figure img").forEach(i=>i.addEventListener("click",()=>{const b=document.getElementById("lightbox");b.querySelector("img").src=i.src;b.classList.add("open")}));document.getElementById("closeLightbox").addEventListener("click",()=>document.getElementById("lightbox").classList.remove("open"));document.getElementById("lightbox").addEventListener("click",e=>{if(e.target.id==="lightbox")e.currentTarget.classList.remove("open")});</script></body></html>
